
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
<link rel="stylesheet" href="/planilha-gastos/assets/css/style.css">
</head>

<body>

    <div class="login-container">

        <h1>Bem-vindo!</h1>
        <p class="subtitulo">Entre na sua conta</p>

        <form id="form-login">
            <div class="campo">
                <label for="email">E-mail</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <button type="submit" class="btn-login">
                Entrar
            </button>
        </form>

        <p class="cadastro">
            Não tem uma conta?
            <a href="cadastro.html">Cadastre-se</a>
        </p>

    </div>

</body>
</html>
